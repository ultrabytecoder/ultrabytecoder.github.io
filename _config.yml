# Site settings
title: ultrabytecoder blog
description: >-
  Personal blog and portfolio. Thoughts, writing, and projects.
author: ultrabytecoder
email: ultrabytecoder@email.com

# URL settings (change these for your repo!)
# For user/org pages (username.github.io), leave baseurl empty
# For project pages (username.github.io/repo-name), set baseurl: "/repo-name"
url: "https://ultrabytecoder.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Blog settings
show_excerpts: true
excerpt_length: 200

# Pagination (requires jekyll-paginate, or use jekyll-paginate-v2)
paginate: 5
paginate_path: "/page:num/"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
